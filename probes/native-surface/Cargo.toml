[package]
name = "luma-surface-scene-proof"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[[bin]]
name = "surface-scene-proof"
path = "src/main.rs"

[dependencies]
plx_base = { path = "../../.dependencies/plx-native/rust-modules/base" }
plx_gfx = { path = "../../.dependencies/plx-native/rust-modules/gfx" }
libc = "=0.2.186"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
