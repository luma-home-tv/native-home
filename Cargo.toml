[package]
name = "native_home"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Luma Home native dashboard; explicitly depends on the PlxNative UI framework"

[workspace]
exclude = [".dependencies/plx-native/rust-modules"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
plx_ui = { path = ".dependencies/plx-native/rust-modules/ui" }
plx_gfx = { path = ".dependencies/plx-native/rust-modules/gfx" }
plx_base = { path = ".dependencies/plx-native/rust-modules/base" }
plx_platform = { path = ".dependencies/plx-native/rust-modules/platform" }
plx_machine = { path = ".dependencies/plx-native/rust-modules/machine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
unicode-normalization = "=0.1.25"

[dev-dependencies]
plx_base = { path = ".dependencies/plx-native/rust-modules/base", features = ["test-support"] }

[features]
hostsim = ["plx_gfx/hostsim", "plx_base/hostsim", "plx_platform/hostsim"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

